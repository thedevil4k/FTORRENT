name: Build FTorrent

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'trackersadd.txt'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'trackersadd.txt'

jobs:
  release:
    needs: [build-windows, build-linux, build-arch, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.exe
            ./artifacts/*.zip
            ./artifacts/*.deb
            ./artifacts/*.rpm
            ./artifacts/*.pkg.tar.zst
            ./artifacts/*.flatpak
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Create Continuous Release (Latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            ./artifacts/*.exe
            ./artifacts/*.zip
            ./artifacts/*.deb
            ./artifacts/*.rpm
            ./artifacts/*.pkg.tar.zst
            ./artifacts/*.flatpak
          generate_release_notes: false
          draft: false
          prerelease: true
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/archives
        key: vcpkg-windows-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          vcpkg-windows-${{ matrix.arch }}-

    - name: Install NSIS
      run: |
        choco install nsis -y
        echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Install dependencies
      run: |
        vcpkg install fltk libtorrent zlib libpng libjpeg-turbo --triplet ${{ matrix.arch }}-windows
        if ("${{ matrix.arch }}" -eq "arm64") { vcpkg install fltk --triplet x64-windows }

    - name: Configure CMake
      run: |
        if ("${{ matrix.arch }}" -eq "arm64") {
          $FLUID_PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/fltk/fluid.exe"
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows -A ARM64 "-DFLTK_FLUID_EXECUTABLE=$FLUID_PATH"
        } else {
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows
        }

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Generate Installer
      working-directory: build
      run: |
        cpack -G NSIS -C Release
        cpack -G ZIP -C Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTorrent-windows-${{ matrix.arch }}
        path: |
          build/*.exe
          build/*.zip
          build/Release/FTorrent.exe

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu:24.04
          - arch: i386
            image: i386/debian:bookworm
          - arch: arm64
            image: arm64v8/ubuntu:24.04
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      if: matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v3

    - name: Build and Package
      run: |
        docker run --rm --platform linux/${{ matrix.arch == 'arm64' && 'arm64' || (matrix.arch == 'i386' && '386' || 'amd64') }} -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.image }} bash -c " \
          apt-get update && apt-get install -y sudo git file nodejs && \
          bash scripts/linux/setup/setup-linux.sh && \
          BUILD_DIR=build_linux_${{ matrix.arch }} bash scripts/linux/compilation/build-linux.sh && \
          BUILD_DIR=build_linux_${{ matrix.arch }} bash scripts/linux/installers/create-linux-deb.sh && \
          BUILD_DIR=build_linux_${{ matrix.arch }} bash scripts/linux/installers/create-linux-rpm.sh && \
          chmod -R 777 build_linux_${{ matrix.arch }} \
        "

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTorrent-deb-${{ matrix.arch }}
        path: build_linux_${{ matrix.arch }}/*.deb

    - name: Upload RPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTorrent-rpm-${{ matrix.arch }}
        path: build_linux_${{ matrix.arch }}/*.rpm

  test:
    # The toolbar suite runs the real MainWindow headless and asserts the drawn
    # geometry, so a change to the centring, the spacing or the child count fails
    # here rather than being noticed by eye. `flows` needs the network for its
    # search and torrent steps, so it carries the `network` label and is excluded
    # from this run.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        bash scripts/linux/setup/setup-linux.sh

    - name: Build the tests
      run: |
        cmake -S . -B build_tests -DCMAKE_BUILD_TYPE=Release -DFTORRENT_BUILD_TESTS=ON
        cmake --build build_tests -j"$(nproc)"

    - name: Run the tests
      # xvfb-run gives the tests a display: every assertion is made against
      # widget state or offscreen pixels, but FLTK still opens a window.
      run: xvfb-run -a ctest --test-dir build_tests --output-on-failure -LE network

  build-arch:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Build Arch Package
      run: |
        # 'cairo' provides <cairo.h> (/usr/include/cairo) which is required
        # because Arch's fltk is built with Cairo support (FLTK_HAVE_CAIRO).
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c " \
          pacman -Syu --noconfirm && \
          pacman -S --noconfirm --needed base-devel cmake boost fltk libtorrent-rasterbar libpng libjpeg-turbo zlib cairo curl && \
          BUILD_DIR=build_linux_x86_64 bash scripts/linux/installers/create-linux-arch.sh && \
          chmod -R 777 build_linux_x86_64 \
        "

    - name: Upload Arch Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTorrent-arch-x86_64
        path: build_linux_x86_64/*.pkg.tar.zst

  build-flatpak:
    runs-on: ubuntu-24.04
    # flatpak-builder needs a real flatpak installation with the target
    # runtime preinstalled, so the job must run inside the action's own
    # image; --privileged lets that container set up flatpak itself.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4

    - name: Build Flatpak Bundle
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: io.github.thedevil4k.FTorrent.flatpak
        manifest-path: io.github.thedevil4k.FTorrent.json
        # The action uploads the bundle itself under the app id; disable
        # that so the explicit step below keeps the FTorrent-* naming.
        upload-artifact: false

    - name: Smoke Test the Bundle
      # A link that succeeded says nothing about whether the sandbox can load
      # what it produced. Installing and starting the bundle here means a
      # runtime the app cannot find fails this job instead of being discovered
      # by whoever installs it from Flathub; the checks live in the same script
      # a workstation runs. The container is root and already carries Xvfb and
      # the runtime, so the app is installed system-wide.
      run: xvfb-run -a bash scripts/flatpak/test-flatpak.sh --system --launch

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTorrent-flatpak
        path: io.github.thedevil4k.FTorrent.flatpak
